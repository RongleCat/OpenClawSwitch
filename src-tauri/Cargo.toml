[package]
name = "openclawswitch"
version = "2.0.0"  # [VERSION] 保持与 package.json 和 tauri.conf.json 同步
description = "OpenClawSwitch - OpenClaw configuration manager"
authors = ["RongleCat"]
license = "MIT"
repository = "https://github.com/RongleCat/OpenClawSwitch"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-autostart = "2.2"
tauri-plugin-opener = "2.2"
tauri-plugin-single-instance = "2.2"
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
zip = "0.6"
tokio = { version = "1", features = ["process"] }
bytes = "1.5"
futures-util = "0.3"
flate2 = "1.0"
tar = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
