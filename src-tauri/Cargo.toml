[package]
name = "openclawswitch"
version = "1.2.0"  # [VERSION] 保持与 package.json 和 tauri.conf.json 同步
description = "OpenClawSwitch - OpenClaw configuration manager"
authors = ["RongleCat"]
license = "MIT"
repository = "https://github.com/RongleCat/OpenClawSwitch"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "path-all", "shell-open", "process-all"] }
dirs = "5.0"
reqwest = { version = "0.11", features = ["json"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
zip = "0.6"
tokio = { version = "1", features = ["process"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
