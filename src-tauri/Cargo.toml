[package]
name = "openclawswitch"
version = "1.0.0"
description = "OpenClawSwitch - OpenClaw configuration manager"
authors = ["RongleCat"]
license = "MIT"
repository = "https://github.com/RongleCat/OpenClawSwitch"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "path-all", "shell-open"] }
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
